<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0f0e" media="(prefers-color-scheme: dark)" />
    <title>GreenThread - Sustainability Data Management</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      (function () {
        var choice = 'system';
        try { choice = localStorage.getItem('gt-theme') || 'system'; } catch (e) {}
        var dark = choice === 'dark' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
